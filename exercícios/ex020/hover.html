<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hover example</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        div > p /* > = child selector */{
            display: none;
        }

        div:hover > p {
            display: block;
            color: white;
            background-color: red;
            width: 200px;
        }

        div:hover {
            color: red;
        }

    </style>
</head>
<body>
    <h1>Hover Example</h1>
    <p>Move the cursor over about the text below</p>
    <div>
        Move the cursor over here.
        <p>HIDDEN TEXT ...</p>
    </div>
    <p>End for example</p>
</body>
</html>
