<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>

        /* CUSTOMIZE SELECTORS 

             # = id
             . = class
             (space) = descendant selector
             > = child selector
             : = pseudoclass
             :: = pseudoelement
        */

        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        a {
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited {
            color: darkred;
        }

         a:hover {
            color: black;
            text-decoration: underline;
        }

        a:active {
            color: yellow;
        }

        .special {
            background-color: lightpink;
        }

        .special::after {
            content: ' ⮞';
            font-size: smaller;
            color: darkred;
        }

        .special::before {
            content: '⮜ ';
            font-size: smaller;
            color: darkred;
        }

        a::before {
            content: '⇒ ';
        }

        a::after {
            content: ' ⇐';
        }

    </style>
</head>
<body>
    <h1>Customizing Links</h1>
    <ul>
        <li><a href="https://github.com/Fequer" target="_blank">Github Repository</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" class="special">YouTube Channel</a></li>
        <li><a href="https://www.cursoemvideo.com">CursoemVideo Website</a></li>
    </ul>
</body>
</html>
